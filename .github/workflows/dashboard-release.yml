name: Release SCV2 Dashboard

on:
  push:
    tags:
      - "dashboard-v*"

permissions:
  contents: write

jobs:
  release-dashboard:
    name: Build and publish dashboard
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: tools/requirements-dashboard.txt

      - name: Install dashboard dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r .\tools\requirements-dashboard.txt

      - name: Test and package dashboard
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe .\tools\scv2_dashboard.py --self-test
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\build-dashboard-exe.ps1

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "SCV2 Dashboard $env:RELEASE_TAG" --generate-notes --verify-tag
          }
          $hash = (Get-FileHash -LiteralPath ".\SCV2 Dashboard.exe" -Algorithm SHA256).Hash
          "$hash *SCV2 Dashboard.exe" | Set-Content -LiteralPath ".\SCV2 Dashboard.exe.sha256" -Encoding ascii -NoNewline
          gh release upload $env:RELEASE_TAG ".\SCV2 Dashboard.exe" ".\SCV2 Dashboard.exe.sha256" --clobber
