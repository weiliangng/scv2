name: Release SCV2 firmware

on:
  push:
    tags:
      - "firmware-v*"

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    env:
      ARM_GNU_TOOLCHAIN_VERSION: 14.3.rel1
      ARM_GNU_TOOLCHAIN_ARCHIVE: arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Install pinned Arm GNU Toolchain
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$ARM_GNU_TOOLCHAIN_ARCHIVE" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/$ARM_GNU_TOOLCHAIN_VERSION/binrel/$ARM_GNU_TOOLCHAIN_ARCHIVE"
          tar -xf "$ARM_GNU_TOOLCHAIN_ARCHIVE"
          echo "$GITHUB_WORKSPACE/${ARM_GNU_TOOLCHAIN_ARCHIVE%.tar.xz}/bin" >> "$GITHUB_PATH"

      - name: Configure and build MinSizeRel firmware
        shell: bash
        run: |
          arm-none-eabi-gcc --version
          cmake --preset MinSizeRel
          cmake --build --preset MinSizeRel

      - name: Prepare firmware release assets
        shell: bash
        run: |
          mkdir release-assets
          cp build/MinSizeRel/test.elf release-assets/SCV2_Firmware.elf
          cp build/MinSizeRel/test.map release-assets/SCV2_Firmware.map
          arm-none-eabi-objcopy -O binary build/MinSizeRel/test.elf release-assets/SCV2_Firmware.bin
          arm-none-eabi-objcopy -O ihex build/MinSizeRel/test.elf release-assets/SCV2_Firmware.hex
          (
            echo "commit: $GITHUB_SHA"
            arm-none-eabi-gcc --version | head -n 1
            cmake --version | head -n 1
            echo "ninja $(ninja --version)"
          ) > release-assets/SCV2_Firmware.build.txt
          (
            cd release-assets
            sha256sum SCV2_Firmware.elf SCV2_Firmware.bin SCV2_Firmware.hex SCV2_Firmware.map > SCV2_Firmware.sha256
          )

      - name: Stage firmware release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: release-assets/
          if-no-files-found: error

  publish-release:
    name: Publish firmware release
    needs: [build-firmware]
    runs-on: ubuntu-latest

    steps:
      - name: Download firmware release assets
        uses: actions/download-artifact@v5
        with:
          name: release-firmware
          path: release-assets

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "SCV2 Firmware $RELEASE_TAG" --generate-notes --verify-tag
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
